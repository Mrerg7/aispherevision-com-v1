name = "aispherevision-com-v1"
main = "src/worker.js"
compatibility_date = "2026-06-01"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "aispherevision.com"
custom_domain = true

[[routes]]
pattern = "www.aispherevision.com"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "404-page"
